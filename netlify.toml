# netlify.toml — foto-site (foto.strids-focus.nl)
#
# Deze site bestaat niet meer als losse website. Alles wat hier binnenkomt
# gaat permanent door naar www.strids-focus.nl, zodat oude links en
# gedeelde adressen blijven werken en Google het adres samenvoegt met www.
#
# status = 301  : permanent verhuisd (zoekmachines nemen dit over)
# force  = true : ook doorsturen als er toevallig nog een bestand staat

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "https://www.strids-focus.nl/:splat"
  status = 301
  force = true
